version: '3.8'

services:
  # 1. Frontend SPA container serving built assets via Nginx on port 3010
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vision79_frontend
    security_opt:
      - no-new-privileges:true
    expose:
      - "3010"
    restart: unless-stopped
    networks:
      - proxy_network

  # 2. Backend API Express container listening on port 3020
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vision79_backend
    security_opt:
      - no-new-privileges:true
    expose:
      - "3020"
    volumes:
      - vision79_db_data:/app
    environment:
      - NODE_ENV=production
      - PORT=3020
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FFPRO2_API_KEY=${FFPRO2_API_KEY:-ffpro2_secret_key_123}
    restart: unless-stopped
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  vision79_db_data:
    driver: local
